name: testes

on:
  push:
    branches: [main]   # nas outras branches, quem roda é o pull_request
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    # Um PostgreSQL de verdade só para os testes; some quando o job acaba.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: conciliacao_testes
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/conciliacao_testes

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Rodar testes
        run: python -m pytest -v
